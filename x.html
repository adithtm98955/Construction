<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa & Flat Line Drawing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .hero {
            width: 100%;
            height: 100vh;
        }

        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="hero">
        <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">

            <!-- STROKE STYLE -->
            <g fill="none" stroke="#000" stroke-width="1">

                <!-- ================= VILLA ================= -->

                <!-- Roof -->
                <polygon points="150,420 350,300 550,420" />
                <line x1="350" y1="300" x2="350" y2="420" />

                <!-- Villa Body -->
                <rect x="200" y="420" width="300" height="220" />

                <!-- Door -->
                <rect x="330" y="500" width="60" height="140" />

                <!-- Windows -->
                <rect x="230" y="470" width="60" height="60" />
                <rect x="410" y="470" width="60" height="60" />

                <!-- Porch Lines -->
                <line x1="200" y1="450" x2="500" y2="450" />

                <!-- ================= FLAT / APARTMENT ================= -->

                <!-- Main Building -->
                <rect x="850" y="250" width="350" height="430" />

                <!-- Floor Lines -->
                <line x1="850" y1="310" x2="1200" y2="310" />
                <line x1="850" y1="370" x2="1200" y2="370" />
                <line x1="850" y1="430" x2="1200" y2="430" />
                <line x1="850" y1="490" x2="1200" y2="490" />
                <line x1="850" y1="550" x2="1200" y2="550" />

                <!-- Balconies -->
                <rect x="880" y="330" width="70" height="40" />
                <rect x="1000" y="330" width="70" height="40" />
                <rect x="1120" y="330" width="70" height="40" />

                <rect x="880" y="390" width="70" height="40" />
                <rect x="1000" y="390" width="70" height="40" />
                <rect x="1120" y="390" width="70" height="40" />

                <!-- Windows -->
                <rect x="900" y="270" width="40" height="30" />
                <rect x="980" y="270" width="40" height="30" />
                <rect x="1060" y="270" width="40" height="30" />
                <rect x="1140" y="270" width="40" height="30" />

                <!-- ================= GROUND / ROAD ================= -->

                <path d="M0 700 C 400 650, 800 780, 1600 720" />
                <path d="M0 740 C 400 690, 800 820, 1600 760" />

                <!-- ================= CONSTRUCTION GUIDE LINES ================= -->

                <line x1="350" y1="0" x2="350" y2="300" stroke-dasharray="4,6" />
                <line x1="1025" y1="0" x2="1025" y2="250" stroke-dasharray="4,6" />

            </g>

        </svg>
    </div>

</body>

</html>
